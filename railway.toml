# Hosting preparation only — no services are created or deployed by this file.
# Requires approved OIDC, managed PostgreSQL and secured test environment.
[build]
builder = "NIXPACKS"
buildCommand = "npm install --omit=dev --no-audit --no-fund && npm run build:identity"

[deploy]
startCommand = "npm start"
healthcheckPath = "/healthz"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
